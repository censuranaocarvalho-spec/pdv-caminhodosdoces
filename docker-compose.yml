version: '3.8'

services:
  core-orders:
    build: ./core-orders
    container_name: service_core_orders
    ports:
      - "8001:8001"
    environment:
      - FINANCE_URL=http://finance-ledger:8003/api/v1/ledger/entries
      - INTEGRATIONS_URL=http://integrations-hub:8002/api/v1/integrations/notify
    networks:
      - pdv-net

  integrations-hub:
    build: ./integrations-hub
    container_name: service_integrations_hub
    ports:
      - "8002:8002"
    networks:
      - pdv-net

  finance-ledger:
    build: ./finance-ledger
    container_name: service_finance_ledger
    ports:
      - "8003:8003"
    networks:
      - pdv-net

  frontend:
    build: ./frontend
    container_name: service_frontend
    ports:
      - "8501:8501"
    networks:
      - pdv-net

networks:
  pdv-net:
    driver: bridge
