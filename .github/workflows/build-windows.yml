name: Build Windows EXEs
permissions:
  contents: write
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install fastapi "uvicorn[standard]" pydantic python-multipart
          pip install websocket-client Pillow qrcode requests httpx jinja2
          pip install PyQt6

      - name: Build gerenciador.exe
        run: pyinstaller gerenciador.spec --clean --noconfirm

      - name: Build main.exe
        run: pyinstaller main.spec --clean --noconfirm

      - name: Montar pasta completa do PDV
        shell: pwsh
        run: |
          $out = "dist/pdv-caminho-dos-doces"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item -Force "dist/gerenciador.exe" "$out/gerenciador.exe"
          Copy-Item -Recurse -Force "dist/main" "$out/main"
          if (Test-Path "versao.txt") { Copy-Item -Force "versao.txt" "$out/versao.txt" }
          @"
          Caminho dos Doces — PDV (Windows)

          1. Extraia ESTE zip inteiro numa pasta (ex.: Documentos\CaminhoDosDoces).
          2. Abra gerenciador.exe (nao precisa instalar Python nem Git).
          3. Clique em Ligar — o PDV abre em http://127.0.0.1:8090

          A pasta main/ precisa ficar ao lado do gerenciador.exe.
          Os dados da loja ficam em main\dados\ (nao apague).
          "@ | Set-Content -Encoding UTF8 "$out/LEIA-ME.txt"
          Compress-Archive -Path "$out\*" -DestinationPath "dist/pdv-caminho-dos-doces-windows.zip" -Force

      - name: Upload zip completo
        uses: actions/upload-artifact@v4
        with:
          name: pdv-caminho-dos-doces-windows
          path: dist/pdv-caminho-dos-doces-windows.zip

      - name: Upload pasta (sem zip)
        uses: actions/upload-artifact@v4
        with:
          name: pdv-pasta-windows
          path: dist/pdv-caminho-dos-doces/**

      - name: Criar Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: PDV Windows v${{ github.run_number }}
          body: |
            Zip completo do PDV (sem Python/Git no PC):

            1. Baixe **pdv-caminho-dos-doces-windows.zip**
            2. Extraia a pasta inteira
            3. Abra **gerenciador.exe** → Ligar

            A pasta `main/` precisa ficar ao lado do `gerenciador.exe`.
          files: |
            dist/pdv-caminho-dos-doces-windows.zip
            dist/gerenciador.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
