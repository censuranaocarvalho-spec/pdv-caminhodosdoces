name: Build Windows EXEs
permissions:
  contents: write
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install fastapi "uvicorn[standard]" pydantic python-multipart
          pip install psycopg2-binary redis pika requests jinja2 httpx
          pip install PyQt6

      - name: Build gerenciador.exe
        run: pyinstaller gerenciador.spec --clean --noconfirm

      - name: Build main.exe
        run: pyinstaller main.spec --clean --noconfirm

      - name: Upload gerenciador
        uses: actions/upload-artifact@v4
        with:
          name: gerenciador-windows
          path: dist/gerenciador.exe

      - name: Upload main
        uses: actions/upload-artifact@v4
        with:
          name: main-windows
          path: dist/main/**

      - name: Criar Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: dist/gerenciador.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

