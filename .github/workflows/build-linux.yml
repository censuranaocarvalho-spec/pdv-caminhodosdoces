name: Build Linux binaries
permissions:
  contents: write
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências do sistema (PyQt6)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0 libegl1

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Linux
        run: bash instalador/build-linux.sh

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: pdv-caminho-dos-doces-linux
          path: dist/pdv-caminho-dos-doces-linux.zip

      - name: Upload pasta
        uses: actions/upload-artifact@v4
        with:
          name: pdv-pasta-linux
          path: dist/pdv-caminho-dos-doces/**

      - name: Anexar na Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}-linux
          name: PDV Linux v${{ github.run_number }}
          body: |
            Zip completo do PDV para Linux:

            1. Baixe **pdv-caminho-dos-doces-linux.zip**
            2. Extraia a pasta inteira
            3. Rode **./gerenciador** → Ligar

            A pasta `main/` precisa ficar ao lado do `gerenciador`.
          files: |
            dist/pdv-caminho-dos-doces-linux.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
