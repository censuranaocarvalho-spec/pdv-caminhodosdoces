openapi: 3.0.3
info:
  title: PDV & Hub Operacional - Caminho dos Doces API
  description: API Unificada de Gestão de Pedidos, Integração com Marketplaces, CRM e Compliance Fiscal/Sanitário.
  version: 1.0.0
paths:
  /api/v1/orders:
    post:
      summary: Cria um novo pedido (Balcão ou Venda Externa)
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                channel:
                  type: string
                  example: "WHATSAPP"
                customerPhone:
                  type: string
                  example: "5511999998888"
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      productId:
                        type: string
                      quantity:
                        type: integer
                paymentType:
                  type: string
                  enum: ["INTEGRAL", "PARCIAL_50_50"]
      responses:
        '201':
          description: Pedido criado com sucesso.

  /api/v1/compliance/audit:
    get:
      summary: Consulta registros de auditoria com filtros aplicados
      operationId: getAuditLogs
      parameters:
        - name: channel
          in: query
          schema:
            type: string
        - name: complianceStatus
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Relatório de auditoria gerado.
